server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ruralflow
    username: postgres
    password: 5432
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # Prisma preserved camel-case column identifiers with PostgreSQL quoting.
        # Do not transform explicit entity names into snake_case before validation.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

logging:
  level:
    com.agriroute: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  internal-api-key: ${INTERNAL_API_KEY:ela-internal-dev-key-2026}
